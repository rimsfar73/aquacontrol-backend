# AQUACONTROL BACKEND - CONFIGURACION GENERAL
spring.application.name=aquacontrol-backend
server.port=${PORT:8080}

# POSTGRESQL 17.11 - APP_BEBEDEROS
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app_bebederos}
spring.datasource.username=${DB_USER:aquacontrol_app}
spring.datasource.password=${DB_PASSWORD}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# MANEJO DE ERRORES
server.error.include-message=never
