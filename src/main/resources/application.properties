# Identificacion del backend.
spring.application.name=aquacontrol-backend
server.port=${PORT:8080}

# Conexion PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app_bebederos}
spring.datasource.username=${DB_USER:aquacontrol_app}
spring.datasource.password=${DB_PASSWORD}

# Estructura de tablas durante desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Respuestas de error.
server.error.include-message=never

# Claves RSA para JWT.
auth.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
auth.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}

# Carga de fotografias.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB