# Identificamos el backend y su puerto.
spring.application.name=aquacontrol-backend
server.port=${PORT:8080}

# Conservamos la configuración predeterminada del equipo.
# Cada integrante puede seleccionar su base y usuario mediante estas variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app_bebederos}
spring.datasource.username=${DB_USER:aquacontrol_app}

# Entregamos la contraseña desde la terminal, sin guardarla en Git.
spring.datasource.password=${DB_PASSWORD}

# Actualizamos la estructura de las tablas durante el desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Evitamos exponer detalles internos en las respuestas de error.
server.error.include-message=never

# Conservamos las rutas de las claves que utiliza la autenticación JWT.
auth.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
auth.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}

# Recibimos las imágenes como archivos mediante formularios multipart.
spring.servlet.multipart.enabled=true

# Permitimos hasta 5 MiB por imagen.
spring.servlet.multipart.max-file-size=5MB

# Dejamos espacio adicional para los datos del formulario.
spring.servlet.multipart.max-request-size=6MB